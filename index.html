<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <!-- Librerías de Excel, Tailwind y Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">📋 Registro de Estudiantes</h1>
        <p class="text-slate-600 mb-6 text-center text-sm">Selecciona tu nombre y completa los campos progresivamente.</p>

        <form id="registroForm" class="space-y-4">
            <!-- Paso 1: Seleccionar Nombre -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. Selecciona tu Nombre:</label>
                <select id="nombre" onchange="mostrarPaso2()" class="w-full border border-slate-300 rounded-lg p-3 bg-white text-slate-800 focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Selecciona tu nombre --</option>
                </select>
            </div>

            <!-- Paso 2: Tipo de Documento -->
            <div id="block-tipoDoc" class="hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. Tipo de Documento:</label>
                <select id="tipoDoc" onchange="mostrarPaso3()" class="w-full border border-slate-300 rounded-lg p-3 bg-white text-slate-800 focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Selecciona el tipo de documento --</option>
                    <option value="Cédula de Ciudadanía">Cédula de Ciudadanía</option>
                    <option value="Tarjeta de Identidad">Tarjeta de Identidad</option>
                    <option value="Cédula de Extranjería">Cédula de Extranjería</option>
                    <option value="Permiso por Protección Temporal (PPT)">Permiso por Protección Temporal (PPT)</option>
                </select>
            </div>

            <!-- Paso 3: Número de Documento -->
            <div id="block-numDoc" class="hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">3. Número de Documento:</label>
                <input type="text" id="numDoc" oninput="mostrarPaso4()" class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 focus:ring-2 focus:ring-blue-500" placeholder="Ej. 1065...">
            </div>

            <!-- Paso 4: Teléfono -->
            <div id="block-telefono" class="hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">4. Número de Teléfono / Celular:</label>
                <input type="tel" id="telefono" oninput="mostrarPaso5()" class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 focus:ring-2 focus:ring-blue-500" placeholder="Ej. 3001234567">
            </div>

            <!-- Paso 5: Correo y Guardar -->
            <div id="block-correo" class="hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">5. Correo Electrónico:</label>
                <input type="email" id="correo" class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 focus:ring-2 focus:ring-blue-500" placeholder="correo@ejemplo.com">
                <button type="submit" class="mt-4 w-full bg-emerald-600 text-white font-medium py-3 rounded-lg hover:bg-emerald-700 transition">✅ Guardar Mis Datos</button>
            </div>
        </form>

        <div id="mensaje" class="mt-4 hidden p-3 rounded-lg text-sm text-center"></div>

        <hr class="my-8">

        <!-- Panel del Instructor -->
        <div id="loginInstructor" class="bg-slate-100 p-4 rounded-lg">
            <h2 class="text-base font-bold text-slate-800 mb-1">🔒 Panel del Instructor</h2>
            <p class="text-xs text-slate-600 mb-2">Ingresa tu contraseña para ver los registros en la nube y descargar el Excel.</p>
            <div class="flex gap-2">
                <input type="password" id="claveInstructor" placeholder="Contraseña" class="border border-slate-300 rounded-lg p-2 text-sm flex-1">
                <button onclick="verificarClave()" class="bg-slate-800 text-white font-medium px-4 py-2 rounded-lg hover:bg-slate-900 transition text-sm">Acceder</button>
            </div>
            <p id="errorClave" class="text-red-500 text-xs mt-2 hidden">Contraseña incorrecta.</p>
        </div>

        <div id="panelProtegido" class="hidden mt-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-slate-800">Listado Consolidado (Nube)</h2>
                <div class="flex gap-2">
                    <button onclick="descargarExcel()" class="bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-lg hover:bg-emerald-700 transition text-xs">📥 Descargar Excel</button>
                    <button onclick="cerrarPanel()" class="bg-red-600 text-white font-medium px-3 py-1.5 rounded-lg hover:bg-red-700 transition text-xs">Bloquear</button>
                </div>
            </div>
            <div class="overflow-x-auto border border-slate-200 rounded-lg max-h-60">
                <table id="tablaEstudiantes" class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                        <tr>
                            <th class="p-2 border-b">Nombre</th>
                            <th class="p-2 border-b">Tipo</th>
                            <th class="p-2 border-b">N° Doc</th>
                            <th class="p-2 border-b">Tel</th>
                            <th class="p-2 border-b">Correo</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla" class="text-slate-600"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://cdrbznqozzxwihusyzvx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DeoQyoFM1jJHV5BH8Qj4cA_dSEc83nM'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CONTRASENA_SECRETA = "profe123"; 

        const estudiantes = [
            "ALEJANDRO ADOLFO ARAUJO FONSECA",
            "CRISTIAN ROJAS VILLALOBOS",
            "CRISTIAN DE JESUS MIELES CADENA",
            "EDILBERTO DIAZ PEÑA",
            "FERNANDO ENRIQUE CASTRILLO ROMERO",
            "JESUS MANUEL TORRES MEJIA",
            "JUAN CAMILO MORENO PISCIOTTY",
            "KAROLL KATTIER FUENTES ACUÑA",
            "MANUEL ALEJANDRO MADERO MOLINA",
            "MARIA CAMILA FLOREZ CASTILLEJO",
            "RAUL SANTIAGO MENESES TAPIAS",
            "SAMUEL DAVID OCHOA ELIAS",
            "SERGIO ANDRES DUQUE DITTA",
            "SHARICK SOFIA HERRERA TORRES",
            "SHARITH DAYANA TURIZO MARTINEZ",
            "YOVANI ANDRES MONTERO GARCIA",
            "YURLEY CENITH DITTA MANCILLA"
        ];

        const selectNombre = document.getElementById('nombre');
        estudiantes.forEach(nombre => {
            let opt = document.createElement('option');
            opt.value = nombre;
            opt.textContent = nombre;
            selectNombre.appendChild(opt);
        });

        function mostrarPaso2() {
            if (selectNombre.value) {
                document.getElementById('block-tipoDoc').classList.remove('hidden');
            } else {
                document.getElementById('block-tipoDoc').classList.add('hidden');
                document.getElementById('block-numDoc').classList.add('hidden');
                document.getElementById('block-telefono').classList.add('hidden');
                document.getElementById('block-correo').classList.add('hidden');
            }
        }

        function mostrarPaso3() {
            if (document.getElementById('tipoDoc').value) {
                document.getElementById('block-numDoc').classList.remove('hidden');
            } else {
                document.getElementById('block-numDoc').classList.add('hidden');
                document.getElementById('block-telefono').classList.add('hidden');
                document.getElementById('block-correo').classList.add('hidden');
            }
        }

        function mostrarPaso4() {
            if (document.getElementById('numDoc').value.trim().length > 0) {
                document.getElementById('block-telefono').classList.remove('hidden');
            } else {
                document.getElementById('block-telefono').classList.add('hidden');
                document.getElementById('block-correo').classList.add('hidden');
            }
        }

        function mostrarPaso5() {
            if (document.getElementById('telefono').value.trim().length > 0) {
                document.getElementById('block-correo').classList.remove('hidden');
            } else {
                document.getElementById('block-correo').classList.add('hidden');
            }
        }

        // Enviar datos a la tabla 'Estudiantes' en Supabase
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const tipo_doc = document.getElementById('tipoDoc').value;
            const num_doc = document.getElementById('numDoc').value;
            const telefono = document.getElementById('telefono').value;
            const correo = document.getElementById('correo').value;

            if (!nombre || !tipo_doc || !num_doc || !telefono || !correo) {
                alert("Por favor completa todos los campos.");
                return;
            }

            const { error } = await _supabase
                .from('Estudiantes')
                .upsert({ nombre, tipo_doc, num_doc, telefono, correo });

            const msg = document.getElementById('mensaje');
            if (error) {
                msg.className = "mt-4 p-3 rounded-lg text-sm bg-red-100 text-red-800 block";
                msg.textContent = "Hubo un error al guardar los datos. Revisa la consola.";
                console.error(error);
            } else {
                msg.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-100 text-emerald-800 block";
                msg.textContent = `¡Datos guardados exitosamente en la nube para ${nombre}!`;
                
                setTimeout(() => {
                    document.getElementById('registroForm').reset();
                    document.getElementById('block-tipoDoc').classList.add('hidden');
                    document.getElementById('block-numDoc').classList.add('hidden');
                    document.getElementById('block-telefono').classList.add('hidden');
                    document.getElementById('block-correo').classList.add('hidden');
                    msg.classList.add('hidden');
                }, 3000);
            }
        });

        async function actualizarTabla() {
            const { data, error } = await _supabase.from('Estudiantes').select('*').order('nombre', { ascending: true });
            
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = "";
            
            if (error || !data) return;

            data.forEach(item => {
                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-2 font-medium text-slate-800">${item.nombre || ''}</td>
                    <td class="p-2">${item.tipo_doc || ''}</td>
                    <td class="p-2">${item.num_doc || ''}</td>
                    <td class="p-2">${item.telefono || ''}</td>
                    <td class="p-2">${item.correo || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function verificarClave() {
            const claveIngresada = document.getElementById('claveInstructor').value;
            if (claveIngresada === CONTRASENA_SECRETA) {
                document.getElementById('loginInstructor').classList.add('hidden');
                document.getElementById('panelProtegido').classList.remove('hidden');
                await actualizarTabla();
            } else {
                document.getElementById('errorClave').classList.remove('hidden');
            }
        }

        function cerrarPanel() {
            document.getElementById('panelProtegido').classList.add('hidden');
            document.getElementById('loginInstructor').classList.remove('hidden');
            document.getElementById('claveInstructor').value = "";
            document.getElementById('errorClave').classList.add('hidden');
        }

        async function descargarExcel() {
            const { data, error } = await _supabase.from('Estudiantes').select('*').order('nombre', { ascending: true });
            if (error || !data) {
                alert("No se pudieron cargar los datos para exportar.");
                return;
            }

            let dataExport = data.map(r => ({
                "Nombre del Estudiante": r.nombre,
                "Tipo de Documento": r.tipo_doc,
                "Número de Documento": r.num_doc,
                "Número de Teléfono": r.telefono,
                "Correo Electrónico": r.correo
            }));

            let worksheet = XLSX.utils.json_to_sheet(dataExport);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Estudiantes");
            XLSX.writeFile(workbook, "Listado_Estudiantes_Cloud.xlsx");
        }
    </script>
</body>
</html>
