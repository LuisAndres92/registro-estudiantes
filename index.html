<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">📋 Registro de Estudiantes</h1>
        <p class="text-slate-600 mb-6 text-center text-sm">Completa los pasos para registrar tus datos.</p>

        <form id="registroForm" class="space-y-5">
            <!-- Paso 1: Seleccionar Nombre -->
            <div id="step-1" class="step-container">
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. Selecciona tu Nombre:</label>
                <select id="nombre" class="w-full border border-slate-300 rounded-lg p-3 bg-white text-slate-800 focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Selecciona tu nombre --</option>
                </select>
                <button type="button" onclick="siguientePaso(1)" class="mt-3 w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">Siguiente ➡️</button>
            </div>

            <!-- Paso 2: Tipo de Documento -->
            <div id="step-2" class="step-container hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. Tipo de Documento:</label>
                <select id="tipoDoc" class="w-full border border-slate-300 rounded-lg p-3 bg-white text-slate-800 focus:ring-2 focus:ring-blue-500">
                    <option value="Cédula de Ciudadanía">Cédula de Ciudadanía</option>
                    <option value="Tarjeta de Identidad">Tarjeta de Identidad</option>
                    <option value="Cédula de Extranjería">Cédula de Extranjería</option>
                    <option value="Permiso por Protección Temporal (PPT)">Permiso por Protección Temporal (PPT)</option>
                </select>
                <button type="button" onclick="siguientePaso(2)" class="mt-3 w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">Siguiente ➡️</button>
            </div>

            <!-- Paso 3: Número de Documento -->
            <div id="step-3" class="step-container hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">3. Número de Documento:</label>
                <input type="text" id="numDoc" class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 focus:ring-2 focus:ring-blue-500" placeholder="Ej. 1065...">
                <button type="button" onclick="siguientePaso(3)" class="mt-3 w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">Siguiente ➡️</button>
            </div>

            <!-- Paso 4: Teléfono -->
            <div id="step-4" class="step-container hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">4. Número de Teléfono / Celular:</label>
                <input type="tel" id="telefono" class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 focus:ring-2 focus:ring-blue-500" placeholder="Ej. 3001234567">
                <button type="button" onclick="siguientePaso(4)" class="mt-3 w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">Siguiente ➡️</button>
            </div>

            <!-- Paso 5: Correo y Guardar -->
            <div id="step-5" class="step-container hidden">
                <label class="block text-sm font-semibold text-slate-700 mb-1">5. Correo Electrónico:</label>
                <input type="email" id="correo" class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 focus:ring-2 focus:ring-blue-500" placeholder="correo@ejemplo.com">
                <button type="submit" class="mt-3 w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-700 transition">✅ Guardar Mis Datos</button>
            </div>
        </form>

        <div id="mensaje" class="mt-4 hidden p-3 rounded-lg text-sm text-center"></div>

        <hr class="my-8">

        <!-- Panel del Instructor -->
        <div id="loginInstructor" class="bg-slate-100 p-4 rounded-lg">
            <h2 class="text-base font-bold text-slate-800 mb-1">🔒 Panel del Instructor</h2>
            <p class="text-xs text-slate-600 mb-2">Ingresa tu contraseña para ver los registros y descargar el Excel.</p>
            <div class="flex gap-2">
                <input type="password" id="claveInstructor" placeholder="Contraseña" class="border border-slate-300 rounded-lg p-2 text-sm flex-1">
                <button onclick="verificarClave()" class="bg-slate-800 text-white font-medium px-4 py-2 rounded-lg hover:bg-slate-900 transition text-sm">Acceder</button>
            </div>
            <p id="errorClave" class="text-red-500 text-xs mt-2 hidden">Contraseña incorrecta.</p>
        </div>

        <div id="panelProtegido" class="hidden mt-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-slate-800">Listado Consolidado</h2>
                <div class="flex gap-2">
                    <button onclick="descargarExcel()" class="bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-lg hover:bg-emerald-700 transition text-xs">📥 Descargar Excel</button>
                    <button onclick="cerrarPanel()" class="bg-red-600 text-white font-medium px-3 py-1.5 rounded-lg hover:bg-red-700 transition text-xs">Bloquear</button>
                </div>
            </div>
            <div class="overflow-x-auto border border-slate-200 rounded-lg max-h-60">
                <table id="tablaEstudiantes" class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                        <tr>
                            <th class="p-2 border-b">Nombre</th>
                            <th class="p-2 border-b">Tipo</th>
                            <th class="p-2 border-b">N° Doc</th>
                            <th class="p-2 border-b">Tel</th>
                            <th class="p-2 border-b">Correo</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla" class="text-slate-600"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CONTRASENA_SECRETA = "profe123"; 

        const estudiantes = [
            "ALEJANDRO ADOLFO ARAUJO FONSECA",
            "CRISTIAN ROJAS VILLALOBOS",
            "CRISTIAN DE JESUS MIELES CADENA",
            "EDILBERTO DIAZ PEÑA",
            "FERNANDO ENRIQUE CASTRILLO ROMERO",
            "JESUS MANUEL TORRES MEJIA",
            "JUAN CAMILO MORENO PISCIOTTY",
            "KAROLL KATTIER FUENTES ACUÑA",
            "MANUEL ALEJANDRO MADERO MOLINA",
            "MARIA CAMILA FLOREZ CASTILLEJO",
            "RAUL SANTIAGO MENESES TAPIAS",
            "SAMUEL DAVID OCHOA ELIAS",
            "SERGIO ANDRES DUQUE DITTA",
            "SHARICK SOFIA HERRERA TORRES",
            "SHARITH DAYANA TURIZO MARTINEZ",
            "YOVANI ANDRES MONTERO GARCIA",
            "YURLEY CENITH DITTA MANCILLA"
        ];

        let registros = JSON.parse(localStorage.getItem('registros_estudiantes')) || estudiantes.map(nombre => ({
            nombre: nombre, tipoDoc: "", numDoc: "", telefono: "", correo: ""
        }));

        const selectNombre = document.getElementById('nombre');
        estudiantes.forEach(nombre => {
            let opt = document.createElement('option');
            opt.value = nombre;
            opt.textContent = nombre;
            selectNombre.appendChild(opt);
        });

        function siguientePaso(pasoActual) {
            if (pasoActual === 1) {
                if (!document.getElementById('nombre').value) {
                    alert("Por favor selecciona tu nombre.");
                    return;
                }
            } else if (pasoActual === 3) {
                if (!document.getElementById('numDoc').value.trim()) {
                    alert("Por favor ingresa tu número de documento.");
                    return;
                }
            } else if (pasoActual === 4) {
                if (!document.getElementById('telefono').value.trim()) {
                    alert("Por favor ingresa tu número de teléfono.");
                    return;
                }
            }

            document.getElementById(`step-${pasoActual}`).classList.add('hidden');
            document.getElementById(`step-${pasoActual + 1}`).classList.remove('hidden');
        }

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const tipoDoc = document.getElementById('tipoDoc').value;
            const numDoc = document.getElementById('numDoc').value;
            const telefono = document.getElementById('telefono').value;
            const correo = document.getElementById('correo').value;

            if (!correo.trim()) {
                alert("Por favor ingresa tu correo electrónico.");
                return;
            }

            let idx = registros.findIndex(r => r.nombre === nombre);
            if (idx !== -1) {
                registros[idx] = { nombre, tipoDoc, numDoc, telefono, correo };
                localStorage.setItem('registros_estudiantes', JSON.stringify(registros));
                
                const msg = document.getElementById('mensaje');
                msg.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-100 text-emerald-800 block";
                msg.textContent = `¡Datos guardados exitosamente para ${nombre}!`;
                
                document.getElementById('registroForm').reset();
                for(let i=2; i<=5; i++) document.getElementById(`step-${i}`).classList.add('hidden');
                document.getElementById('step-1').classList.remove('hidden');
            }
        });

        function actualizarTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = "";
            registros.forEach(item => {
                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-2 font-medium text-slate-800">${item.nombre}</td>
                    <td class="p-2">${item.tipoDoc}</td>
                    <td class="p-2">${item.numDoc}</td>
                    <td class="p-2">${item.telefono}</td>
                    <td class="p-2">${item.correo}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function verificarClave() {
            const claveIngresada = document.getElementById('claveInstructor').value;
            if (claveIngresada === CONTRASENA_SECRETA) {
                document.getElementById('loginInstructor').classList.add('hidden');
                document.getElementById('panelProtegido').classList.remove('hidden');
                actualizarTabla();
            } else {
                document.getElementById('errorClave').classList.remove('hidden');
            }
        }

        function cerrarPanel() {
            document.getElementById('panelProtegido').classList.add('hidden');
            document.getElementById('loginInstructor').classList.remove('hidden');
            document.getElementById('claveInstructor').value = "";
            document.getElementById('errorClave').classList.add('hidden');
        }

        function descargarExcel() {
            let dataExport = registros.map(r => ({
                "Nombre del Estudiante": r.nombre,
                "Tipo de Documento": r.tipoDoc,
                "Número de Documento": r.numDoc,
                "Número de Teléfono": r.telefono,
                "Correo Electrónico": r.correo
            }));
